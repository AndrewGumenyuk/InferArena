name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check

      - name: Type check with MyPy
        run: mypy src/inferarena

      - name: Test with pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        run: docker build -t inferarena .

      - name: Smoke test CLI in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/inferarena_outputs:/app/inferarena_outputs \
            inferarena run --config examples/experiment.yaml

      - name: Build dev image
        run: docker build --target dev -t inferarena:dev .

      - name: Run tests in dev container
        run: docker run --rm inferarena:dev
