{{- if and .Values.experiment.config (not .Values.experiment.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inferarena.configMapName" . }}
  labels:
    {{- include "inferarena.labels" . | nindent 4 }}
data:
  experiment.yaml: |
    {{- .Values.experiment.config | nindent 4 }}
{{- end }}
