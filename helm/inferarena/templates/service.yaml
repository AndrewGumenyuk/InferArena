{{- if not .Values.job.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inferarena.fullname" . }}
  labels:
    {{- include "inferarena.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "inferarena.selectorLabels" . | nindent 4 }}
{{- end }}
