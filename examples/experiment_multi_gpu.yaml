name: "multi-gpu-baseline"
scheduler: "fcfs"
cache_policy: "no_op"
workload:
  name: "uniform"
  num_requests: 128
  arrival_rate: 8.0
  prompt_tokens: 512
  output_tokens: 128
  seed: 42
engine:
  name: "multi_gpu_simulation"
  max_tokens_per_step: 2048
  prefill_time_per_token: 0.1
  decode_time_per_token: 20.0
cluster:
  router: "round_robin"
  workers:
    - gpu_count: 1
      tensor_parallelism: 1
      pipeline_parallelism: 1
      max_tokens_per_step: 2048
    - gpu_count: 1
      tensor_parallelism: 1
      pipeline_parallelism: 1
      max_tokens_per_step: 2048
max_steps: 50000
output_dir: "./inferarena_outputs"
