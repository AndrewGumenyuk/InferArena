name: "variable"
scheduler: "fcfs"
workload:
  name: "variable"
  num_requests: 128
  arrival_rate: 4.0
  prompt_tokens_min: 64
  prompt_tokens_max: 1024
  output_tokens_min: 16
  output_tokens_max: 256
  seed: 42
engine:
  name: "simulation"
  max_tokens_per_step: 4096
  prefill_time_per_token: 0.1
  decode_time_per_token: 20.0
max_steps: 50000
output_dir: "./inferarena_outputs/benchmarks/variable"
