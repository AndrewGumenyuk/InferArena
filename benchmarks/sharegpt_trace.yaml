name: "sharegpt-trace"
scheduler: "fcfs"
workload:
  name: "trace"
  trace_path: "examples/sharegpt_sample.jsonl"
  trace_format: "sharegpt"
  num_requests: 4
  arrival_rate: 2.0
  output_tokens: 128
  seed: 42
engine:
  name: "simulation"
  max_tokens_per_step: 2048
  prefill_time_per_token: 0.1
  decode_time_per_token: 20.0
max_steps: 50000
output_dir: "./inferarena_outputs/benchmarks/sharegpt_trace"
